<!DOCTYPE html>
<html lang = "pt-br">
    <meta charset="UTF-8">
    <head>
        <title>Portal WiFi - Login Administrativo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="{{ url_for('static', path='/css/styles.css?v=49') }}" rel="stylesheet">
        <style>
            :root {
                --body-color: rgb(35, 35, 35);
                --primary-color: {{primary_color}};
                --background-color: {{secondary_color}};
                --text-color: {{text_color}};
            }
        </style>
    </head>

    <!--AI helped making the bootstrap class for the body-->
    <body class ="min-vh-100 d-flex justify-content-center align-items-center">\

            <!--main central container-->
        <div class = "d-flex flex-column text-center justify-content-start main-container-user">

            <!-- Upper half -->
            <div class="half-up-container pt-4 pb-2 pb-sm-4">
                <div>
                    <h1 class="client-name">Login Admnistrativo</h1>
                </div>
            </div>

            <!-- Latter half -->
            <div class="half-down-container">
                <div class="text-start mt-2 mt-sm-3">
                    <p class="instructions ps-2 ps-sm-4 pt-2 pb-1 pb-sm-2">Login with email and password to access the dashboard</p>

                    <!-- Form for phonenumber -->
                    <form action="/admin/login" method="post" class="form mt-4">
                        <div>
                            <label class="mb-1 mb-sm-2" for="email">Email
                                <!-- AI helped make the red asterisk -->
                                <span class="required">*</span>
                            </label> <br>
                            <input class="ps-2 form-input" type="email" id="email" name="email" placeholder="exemple@exemple.com" required> <br>
                        </div>

                        <div class="mt-3">
                            <label class="mb-1 mb-sm-2" for="password">Password
                                <!-- AI helped make the red asterisk -->
                                <span class="required">*</span>
                            </label> <br>
                            <input class="ps-2 form-input" type="password" id="password" name="password" placeholder="***********" required>
                        </div>

                        {% if error%}
                            <p class ="error mt-2 ps-3">{{error}}</p>
                        {% endif %}

                        <!--Button Google-->
                        <div class="mt-5">
                            <button class="button-google btn btn-primary mt-3 mt-sm-4" type="submit">Continue with Google</button>
                        </div>
                    </form>
                </div>

            </div>
            <div class="container form-footer">
                <p>© 2026 Mkt Nexa</p>
            </div>










        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    </body>
</html>
