<!DOCTYPE html>
<html lang = "pt-br">
    <meta charset="UTF-8">
    <head>
        <title>Dashboard - {{client_name}} </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="{{ url_for('static', path='/css/styles.css?v=25') }}" rel="stylesheet">
        <script src="static/js/main.js" defer></script>
        <style>
            :root {
                --body-color: grey;
                --primary-color: {{primary_color}};
                --background-color: {{secondary_color}};
                --text-color: {{text_color}};
            }
        </style>
    </head>
    <body>
        <div>
            <div class="row g-0">
                <div class="p-0 col-2" id="col-esq">
                    <div class="left-dashb__container">

                        <div class="logo-container mb-3 pt-4">
                            <!-- Uses custom client's logo dinamically -->
                            <img class="logo" src="{{logo}}">
                        </div>

                        <div class="container text-center" >
                            <h1 class="client-name">{{client_name}}</h1>
                        </div>


                        <!--NAVBAR | Using bootstrap pills | Modified from https://getbootstrap.com/docs/5.0/components/navs-tabs/-->
                        <div class="d-flex align-items-center mt-5 nav-menu">
                            <div class="nav flex-column nav-pills" id="v-pill-tab" role="tablist" aria-orientation="vertical">
                                
                                <button class="nav-link active" id="v-pills-home-tab" data-bs-toggle="pill" data-bs-target="#v-pills-home" type="button" role="tab" aria-controls="v-pills-home" aria-selected="true">Home</button>
                                <button class="nav-link " id="v-pills-leads-tab" data-bs-toggle="pill" data-bs-target="#v-pills-leads" type="button" role="tab" aria-controls="v-pills-leads" aria-selected="false">Leads</button>
                                <button class="nav-link " id="v-pills-export-tab" data-bs-toggle="pill" data-bs-target="#v-pills-export" type="button" role="tab" aria-controls="v-pills-export" aria-selected="false">Export</button>
                                <button class="nav-link " id="v-pills-metrics-tab" data-bs-toggle="pill" data-bs-target="#v-pills-metrics" type="button" role="tab" aria-controls="v-pills-metrics" aria-selected="false">Metrics</button>
                                
                                

                            </div>
                        </div>
                    </div>   
                </div>


                <div class="p-0 col" id="col-dir">
                    <div class="right-dashb__container pt-5">

                        <!--Modified from Bootstrap Example - https://getbootstrap.com/docs/5.0/components/navs-tabs-->
                        <div class="tab-content mt-5" id="v-pills-tabContent">
                            <div class="tab-pane fade show active" id="v-pills-home" role="tabpanel" aria-labelledby="v-pills-home-tab">
                                
                                <!--Content of HOME-->

                                <div class="container">
                                    <div class="row main-container-dash">
                                        <div class="col content-box s">
                                            
                                        </div>
                                        <div class="col content-box s">

                                        </div>
                                        <div class="col content-box s">
                                            
                                        </div>
                                        <div class="col content-box s">

                                        </div>
                                    </div>
                                    <div class="row main-container-dash">
                                        <div class="col content-box g">
                                            
                                        </div>
                                        <div class="col-7 content-box g">

                                        </div>
                                    </div>
                                    <div class="row main-container-dash">
                                        <div class="col-7 content-box g">

                                        </div>
                                        <div class="col content-box g" >

                                        </div>
                                    </div>
                                </div>


                            </div>
                            
                            <div class="tab-pane fade" id="v-pills-leads" role="tabpanel" aria-labelledby="v-pills-leads-tab">
                                
                                <!--CONTENT OF LEADS-->
                                <div class="container mb-5 content-box main-container-dash" id="leads-toolbox">
                                    <div class="searchbox">
                                        <form>
                                            <input type="search" name="leads-search" placeholder="search">
                                        </form>
                                    </div>
                                </div>
                                <div class="container content-box main-container-dash" id="container-leads">
                                    
                                    <table class="table-leads">
                                        <thead>
                                            <tr>
                                                <th>Created At</th>
                                                <th>Name</th>
                                                <th>SSID</th>
                                                <th>Phone</th>
                                                <th>Metadata</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {%for lead in leads%}
                                                <tr>
                                                    <td>{{lead.created_at}}</td>
                                                    <td>{{lead.name}}</td>
                                                    <td>{{lead.ssid}}</td>
                                                    <td>{{lead.phone}}</td>
                                                    <td>{{lead.lead_metadata}}</td>
                                                </tr>
                                            {%endfor%}
                                        </tbody>
                                        
                                        
                                    </table>
                                    
                                    
                                </div>
                            </div>
                            
                            <div class="tab-pane fade" id="v-pills-export" role="tabpanel" aria-labelledby="v-pills-export-tab">
                                
                                
                                <div class="container">
                                    <h2 class="client-subname">{{client_subname}}</h2>
                                </div>


                            </div>
                            <div class="tab-pane fade" id="v-pills-metrics" role="tabpanel" aria-labelledby="v-pills-metrics-tab"></div>

                        </div>
                    </div>
                    
                    
                    
                    
                </div>
            </div>
        </div>       
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        
    </body>
</html>
